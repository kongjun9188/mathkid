name: Build APK

# 触发方式：
#   1) 推送到 main / master 分支时自动构建
#   2) 也可以在 GitHub 网页上手动触发：Actions -> Build APK -> Run workflow
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 编译数学小闯关 APK
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 官方 Gradle action：自动下载并缓存指定版本，
      # 不依赖 runner 预装的是哪个 Gradle，保证构建环境一致
      - name: 安装 Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受许可并安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 自动生成签名文件
        run: |
          mkdir -p app/keystore
          keytool -genkeypair -v \
            -keystore app/keystore/mathkid.jks \
            -storepass mathkid123 \
            -keypass mathkid123 \
            -alias mathkid \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=MathKid, OU=Parents, O=MathKid, L=Hefei, ST=Anhui, C=CN"
          test -f app/keystore/mathkid.jks || { echo "签名文件生成失败"; exit 1; }

      - name: 编译 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 校验 APK 产物
        run: |
          mkdir -p output
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "未找到 APK 产物"; exit 1; fi
          cp "$APK" output/mathkid.apk
          ls -lh output/
          echo "APK 大小: $(du -h output/mathkid.apk | cut -f1)"

      - name: 上传 APK（在构建页面底部下载）
        uses: actions/upload-artifact@v4
        with:
          name: mathkid-apk
          path: output/mathkid.apk
          if-no-files-found: error
          retention-days: 90
